---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    quadlet_dir: /etc/containers/systemd
    expected_quadlets:
      - youtarr.network
      - youtarr-config.volume
      - youtarr-jobs.volume
      - youtarr-images.volume
      - youtarr-media.volume
      - youtarr-mariadb-data.volume
      - youtarr-mariadb.container
      - youtarr.container
  tasks:
    - name: Stat each expected quadlet file
      ansible.builtin.stat:
        path: "{{ quadlet_dir }}/{{ item }}"
      register: quadlet_stats
      loop: "{{ expected_quadlets }}"

    - name: Assert each quadlet file exists with the expected mode
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.size > 0
          - item.stat.mode == "0600"
        fail_msg: "Quadlet {{ item.item }} missing or has wrong mode/size"
      loop: "{{ quadlet_stats.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read youtarr container quadlet contents
      ansible.builtin.slurp:
        src: "{{ quadlet_dir }}/youtarr.container"
      register: container_quadlet

    - name: Assert youtarr container quadlet has the expected image, volumes, and ports
      ansible.builtin.assert:
        that:
          - "'docker.io/dialmaster/youtarr' in (container_quadlet.content | b64decode)"
          - "'youtarr-config.volume:/app/config' in (container_quadlet.content | b64decode)"
          - "'youtarr-media.volume:/usr/src/app/data:z' in (container_quadlet.content | b64decode)"
          - "'3087:3011' in (container_quadlet.content | b64decode)"
