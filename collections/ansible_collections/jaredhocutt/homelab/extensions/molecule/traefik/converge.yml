---
- name: Converge
  hosts: all
  gather_facts: false
  tasks:
    - name: Include traefik role
      ansible.builtin.include_role:
        name: jaredhocutt.homelab.traefik

    - name: Attach traefik to a proxy network
      ansible.builtin.include_role:
        name: jaredhocutt.homelab.traefik
        tasks_from: attach
      vars:
        traefik_attach_network: molecule-proxy
