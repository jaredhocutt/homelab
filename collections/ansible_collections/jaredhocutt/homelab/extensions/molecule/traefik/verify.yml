---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    quadlet_dir: /etc/containers/systemd
    expected_quadlets:
      - traefik.network
      - traefik-certs.volume
      - traefik-dynamic.volume
      - traefik.container
  tasks:
    - name: Stat each expected quadlet file
      ansible.builtin.stat:
        path: "{{ quadlet_dir }}/{{ item }}"
      register: quadlet_stats
      loop: "{{ expected_quadlets }}"

    - name: Assert each quadlet file exists with the expected mode
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.size > 0
          - item.stat.mode == "0600"
        fail_msg: "Quadlet {{ item.item }} missing or has wrong mode/size"
      loop: "{{ quadlet_stats.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read traefik container quadlet contents
      ansible.builtin.slurp:
        src: "{{ quadlet_dir }}/traefik.container"
      register: container_quadlet

    - name: Assert traefik container quadlet has the expected image, socket, and ports
      ansible.builtin.assert:
        that:
          - "'ghcr.io/traefik/traefik' in (container_quadlet.content | b64decode)"
          - "'/run/podman/podman.sock:/var/run/docker.sock' in (container_quadlet.content | b64decode)"
          - "'80:80' in (container_quadlet.content | b64decode)"
          - "'443:443' in (container_quadlet.content | b64decode)"

    - name: Get certs volume info
      containers.podman.podman_volume_info:
        name: traefik-certs
      register: certs_volume_info

    - name: Stat the generated certificate files
      ansible.builtin.stat:
        path: "{{ certs_volume_info.volumes[0].Mountpoint }}/{{ item }}"
      register: cert_files
      loop:
        - local.key
        - local.csr
        - local.crt

    - name: Assert the certificate files were generated with the expected mode
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.mode == "0600"
        fail_msg: "Cert file {{ item.item }} missing or has wrong mode"
      loop: "{{ cert_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Get dynamic volume info
      containers.podman.podman_volume_info:
        name: "{{ common_traefik_volume_dynamic | default('traefik-dynamic') }}"
      register: dynamic_volume_info

    - name: Stat tls.yaml in the dynamic volume
      ansible.builtin.stat:
        path: "{{ dynamic_volume_info.volumes[0].Mountpoint }}/tls.yaml"
      register: tls_yaml

    - name: Assert tls.yaml was copied with the expected mode
      ansible.builtin.assert:
        that:
          - tls_yaml.stat.exists
          - tls_yaml.stat.mode == "0600"

    - name: Read proxy network drop-in
      ansible.builtin.slurp:
        src: "{{ quadlet_dir }}/traefik.container.d/network-molecule-proxy.conf"
      register: proxy_dropin

    - name: Read proxy network quadlet
      ansible.builtin.slurp:
        src: "{{ quadlet_dir }}/molecule-proxy.network"
      register: proxy_network_quadlet

    - name: Assert the drop-in adds the proxy network and the network is internal
      ansible.builtin.assert:
        that:
          - "'Network=molecule-proxy.network' in (proxy_dropin.content | b64decode)"
          - "'Internal=true' in (proxy_network_quadlet.content | b64decode)"
          # The podman_network module writes the option as isolate=True
          - "'isolate=true' in (proxy_network_quadlet.content | b64decode | lower)"

    - name: Get traefik container info
      containers.podman.podman_container_info:
        name: traefik
      become: true
      register: traefik_info

    - name: Assert running traefik is connected to the proxy network
      ansible.builtin.assert:
        that:
          - traefik_info.containers[0].State.Running
          - "'traefik' in traefik_info.containers[0].NetworkSettings.Networks"
          - "'molecule-proxy' in traefik_info.containers[0].NetworkSettings.Networks"

    - name: Detach traefik from the proxy network
      ansible.builtin.include_role:
        name: jaredhocutt.homelab.traefik
        tasks_from: detach
      vars:
        traefik_attach_network: molecule-proxy

    - name: Get traefik container info after detach
      containers.podman.podman_container_info:
        name: traefik
      become: true
      register: traefik_info_detached

    - name: Stat proxy network files after detach
      ansible.builtin.stat:
        path: "{{ quadlet_dir }}/{{ item }}"
      register: proxy_files_detached
      loop:
        - traefik.container.d/network-molecule-proxy.conf
        - molecule-proxy.network

    - name: Get proxy network info after detach
      containers.podman.podman_network_info:
        name: molecule-proxy
      become: true
      register: proxy_network_detached
      failed_when: false

    - name: Assert detach removed the drop-in, network and connection
      ansible.builtin.assert:
        that:
          - "'molecule-proxy' not in traefik_info_detached.containers[0].NetworkSettings.Networks"
          - proxy_files_detached.results | selectattr('stat.exists') | list | length == 0
          - proxy_network_detached.networks | default([]) | length == 0
