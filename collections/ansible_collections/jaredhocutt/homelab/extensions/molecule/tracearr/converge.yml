---
- name: Converge
  hosts: all
  gather_facts: false
  vars:
    tracearr_traefik_enable: false
    tracearr_timescaledb_password: test-timescaledb-password
    tracearr_jwt_secret: test-jwt-secret
    tracearr_cookie_secret: test-cookie-secret
  tasks:
    - name: Include tracearr role
      ansible.builtin.include_role:
        name: jaredhocutt.homelab.tracearr
