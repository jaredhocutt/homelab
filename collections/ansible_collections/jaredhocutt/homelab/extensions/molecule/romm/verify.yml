---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    quadlet_dir: /etc/containers/systemd
    expected_quadlets:
      - romm.network
      - romm-resources.volume
      - romm-assets.volume
      - romm-config.volume
      - romm-redis-data.volume
      - romm-library.volume
      - romm-mariadb-data.volume
      - romm-mariadb.container
      - romm.container
  tasks:
    - name: Stat each expected quadlet file
      ansible.builtin.stat:
        path: "{{ quadlet_dir }}/{{ item }}"
      register: quadlet_stats
      loop: "{{ expected_quadlets }}"

    - name: Assert each quadlet file exists with the expected mode
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.size > 0
          - item.stat.mode == "0600"
        fail_msg: "Quadlet {{ item.item }} missing or has wrong mode/size"
      loop: "{{ quadlet_stats.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read romm container quadlet contents
      ansible.builtin.slurp:
        src: "{{ quadlet_dir }}/romm.container"
      register: container_quadlet

    - name: Assert romm container quadlet has the expected image, volumes, and ports
      ansible.builtin.assert:
        that:
          - "'docker.io/rommapp/romm' in (container_quadlet.content | b64decode)"
          - "'romm-resources.volume:/romm/resources' in (container_quadlet.content | b64decode)"
          - "'romm-library.volume:/romm/library:z' in (container_quadlet.content | b64decode)"
          - "'8087:8080' in (container_quadlet.content | b64decode)"
