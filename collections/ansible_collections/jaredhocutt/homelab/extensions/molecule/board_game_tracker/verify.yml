---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    quadlet_dir: /etc/containers/systemd
    expected_quadlets:
      - board-game-tracker.network
      - board-game-tracker-images.volume
      - board-game-tracker-logs.volume
      - board-game-tracker-manuals.volume
      - board-game-tracker-postgres-data.volume
      - board-game-tracker-postgres.container
      - board-game-tracker.container
  tasks:
    - name: Stat each expected quadlet file
      ansible.builtin.stat:
        path: "{{ quadlet_dir }}/{{ item }}"
      register: quadlet_stats
      loop: "{{ expected_quadlets }}"

    - name: Assert each quadlet file exists with the expected mode
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.size > 0
          - item.stat.mode == "0600"
        fail_msg: "Quadlet {{ item.item }} missing or has wrong mode/size"
      loop: "{{ quadlet_stats.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read board_game_tracker container quadlet contents
      ansible.builtin.slurp:
        src: "{{ quadlet_dir }}/board-game-tracker.container"
      register: container_quadlet

    - name: Assert board_game_tracker container quadlet has the expected image, volume, and ports
      ansible.builtin.assert:
        that:
          - "'docker.io/uping/boardgametracker' in (container_quadlet.content | b64decode)"
          - "'board-game-tracker-images.volume:/app/images' in (container_quadlet.content | b64decode)"
          - "'5444:5444' in (container_quadlet.content | b64decode)"
