---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    quadlet_dir: /etc/containers/systemd
    expected_quadlets:
      - postiz.network
      - postiz-config.volume
      - postiz-uploads.volume
      - postiz-postgres-data.volume
      - postiz-redis-data.volume
      - postiz-temporal-config.volume
      - postiz-temporal-postgres-data.volume
      - postiz-temporal-elasticsearch-data.volume
      - postiz-postgres.container
      - postiz-redis.container
      - postiz-temporal.container
      - postiz-temporal-postgres.container
      - postiz-temporal-elasticsearch.container
      - postiz.container
  tasks:
    - name: Stat each expected quadlet file
      ansible.builtin.stat:
        path: "{{ quadlet_dir }}/{{ item }}"
      register: quadlet_stats
      loop: "{{ expected_quadlets }}"

    - name: Assert each quadlet file exists with the expected mode
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.size > 0
          - item.stat.mode == "0600"
        fail_msg: "Quadlet {{ item.item }} missing or has wrong mode/size"
      loop: "{{ quadlet_stats.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read postiz container quadlet contents
      ansible.builtin.slurp:
        src: "{{ quadlet_dir }}/postiz.container"
      register: container_quadlet

    - name: Assert postiz container quadlet has the expected image, volumes, and ports
      ansible.builtin.assert:
        that:
          - "'ghcr.io/gitroomhq/postiz-app' in (container_quadlet.content | b64decode)"
          - "'postiz-uploads.volume:/uploads' in (container_quadlet.content | b64decode)"
          - "'4007:5000' in (container_quadlet.content | b64decode)"
