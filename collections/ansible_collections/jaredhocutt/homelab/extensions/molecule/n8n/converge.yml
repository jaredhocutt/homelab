---
- name: Converge
  hosts: all
  gather_facts: false
  vars:
    n8n_traefik_enable: false
    n8n_postgres_password: test-postgres-password
    n8n_encryption_key: test-encryption-key
    n8n_runners_auth_token: test-runners-auth-token
  tasks:
    - name: Include n8n role
      ansible.builtin.include_role:
        name: jaredhocutt.homelab.n8n
