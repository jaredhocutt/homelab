---
# tasks file for jaredhocutt.homelab.lubelogger

- name: Pull container images
  containers.podman.podman_image:
    name: "{{ item.image }}:{{ item.image_tag }}"
    state: present
  become: true
  loop:
    - image: "{{ lubelogger_image }}"
      image_tag: "{{ lubelogger_image_tag }}"

- name: Create network
  containers.podman.podman_network:
    name: "{{ lubelogger_name }}"
    driver: bridge
    disable_dns: false
    opt:
      isolate: "true"
    quadlet_file_mode: "0600"
    state: quadlet
  become: true

- name: Create volumes
  containers.podman.podman_volume:
    name: "{{ item.name }}"
    quadlet_options: "{{ item.options | default(omit) }}"
    quadlet_file_mode: "0600"
    state: quadlet
  become: true
  loop:
    - name: "{{ lubelogger_volume_data }}"
      options: "{{ lubelogger_volume_data_options | default(omit) }}"
    - name: "{{ lubelogger_volume_keys }}"
      options: "{{ lubelogger_volume_keys_options | default(omit) }}"

- name: Create secrets
  containers.podman.podman_secret:
    name: "{{ item.key }}"
    data: "{{ item.value }}"
    state: present
  become: true
  no_log: true
  loop: "{{ lubelogger_secrets_combined | dict2items }}"

- name: Create lubelogger container
  containers.podman.podman_container:
    name: "{{ lubelogger_name }}"
    image: "{{ lubelogger_image }}:{{ lubelogger_image_tag }}"
    network:
      - "{{ lubelogger_name }}.network"
      - "{{ lubelogger_traefik_enable | ternary(common_traefik_network ~ '.network', omit) }}"
    env: "{{ lookup('jaredhocutt.homelab.container_config', 'env') }}"
    secrets: "{{ lookup('jaredhocutt.homelab.container_config', 'secrets') }}"
    volumes:
      - "{{ lubelogger_volume_data }}.volume:/App/data"
      - "{{ lubelogger_volume_keys }}.volume:/root/.aspnet/DataProtection-Keys"
    publish: "{{ lubelogger_traefik_enable | ternary(omit, lubelogger_ports) }}"
    labels: "{{ lookup('jaredhocutt.homelab.container_config', 'labels') }}"
    quadlet_file_mode: "0600"
    quadlet_options: "{{ lookup('jaredhocutt.homelab.container_config', 'quadlet_options') }}"
    state: quadlet
  notify: Restart {{ lubelogger_name }}
  become: true

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
