---
# tasks file for jaredhocutt.homelab.youtarr

- name: Pull container images
  containers.podman.podman_image:
    name: "{{ item.image }}:{{ item.image_tag }}"
    state: present
  become: true
  loop:
    - image: "{{ youtarr_image }}"
      image_tag: "{{ youtarr_image_tag }}"
    - image: "{{ youtarr_mariadb_image }}"
      image_tag: "{{ youtarr_mariadb_image_tag }}"

- name: Create network
  containers.podman.podman_network:
    name: "{{ youtarr_name }}"
    driver: bridge
    disable_dns: false
    opt:
      isolate: "true"
    quadlet_file_mode: "0600"
    state: quadlet
  become: true

- name: Create volumes
  containers.podman.podman_volume:
    name: "{{ item.name }}"
    quadlet_options: "{{ item.options | default(omit) }}"
    quadlet_file_mode: "0600"
    state: quadlet
  become: true
  loop:
    - name: "{{ youtarr_volume_config }}"
      options: "{{ youtarr_volume_config_options | default(omit) }}"
    - name: "{{ youtarr_volume_jobs }}"
      options: "{{ youtarr_volume_jobs_options | default(omit) }}"
    - name: "{{ youtarr_volume_images }}"
      options: "{{ youtarr_volume_images_options | default(omit) }}"
    - name: "{{ youtarr_volume_media }}"
      options: "{{ youtarr_volume_media_options | default(omit) }}"
    - name: "{{ youtarr_mariadb_volume_data }}"
      options: "{{ youtarr_mariadb_volume_data_options | default(omit) }}"

- name: Create secrets
  containers.podman.podman_secret:
    name: "{{ item.key }}"
    data: "{{ item.value }}"
    state: present
  become: true
  no_log: true
  loop: "{{ youtarr_secrets_combined | dict2items }}"

- name: Create mariadb container
  containers.podman.podman_container:
    name: "{{ youtarr_name }}-mariadb"
    image: "{{ youtarr_mariadb_image }}:{{ youtarr_mariadb_image_tag }}"
    network: "{{ youtarr_name }}.network"
    env: "{{ lookup('jaredhocutt.homelab.container_config', 'env', container='mariadb') }}"
    secrets: "{{ lookup('jaredhocutt.homelab.container_config', 'secrets', container='mariadb') }}"
    volumes:
      - "{{ youtarr_mariadb_volume_data }}.volume:/var/lib/mysql"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck_interval: 5s
    healthcheck_retries: 5
    healthcheck_timeout: 1s
    healthcheck: CMD healthcheck.sh --connect --innodb_initialized
    labels: "{{ lookup('jaredhocutt.homelab.container_config', 'labels', container='mariadb') }}"
    quadlet_file_mode: "0600"
    quadlet_options: "{{ lookup('jaredhocutt.homelab.container_config', 'quadlet_options', container='mariadb') }}"
    state: quadlet
  notify: Restart mariadb for {{ youtarr_name }}
  become: true

- name: Create youtarr container
  containers.podman.podman_container:
    name: "{{ youtarr_name }}"
    image: "{{ youtarr_image }}:{{ youtarr_image_tag }}"
    network:
      - "{{ youtarr_name }}.network"
      - "{{ youtarr_traefik_enable | ternary(common_traefik_network ~ '.network', omit) }}"
    env: "{{ lookup('jaredhocutt.homelab.container_config', 'env') }}"
    secrets: "{{ lookup('jaredhocutt.homelab.container_config', 'secrets') }}"
    security_opt:
      - label=level:s0
    volumes:
      - "{{ youtarr_volume_config }}.volume:/app/config"
      - "{{ youtarr_volume_jobs }}.volume:/app/jobs"
      - "{{ youtarr_volume_images }}.volume:/app/server/images"
      - "{{ youtarr_volume_media }}.volume:{{ youtarr_media_path }}:z"
    publish: "{{ youtarr_traefik_enable | ternary(omit, youtarr_ports) }}"
    healthcheck_interval: 30s
    healthcheck_retries: 3
    healthcheck_start_period: 40s
    healthcheck_timeout: 10s
    healthcheck: CMD curl --fail --silent --show-error --output /dev/null http://localhost:3011/api/health
    labels: "{{ lookup('jaredhocutt.homelab.container_config', 'labels') }}"
    quadlet_file_mode: "0600"
    quadlet_options: "{{ lookup('jaredhocutt.homelab.container_config', 'quadlet_options') }}"
    state: quadlet
  notify: Restart {{ youtarr_name }}
  become: true

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
