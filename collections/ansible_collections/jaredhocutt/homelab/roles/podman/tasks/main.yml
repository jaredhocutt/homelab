---
# tasks file for jaredhocutt.homelab.podman

- name: Install packages
  ansible.builtin.dnf:
    name:
      - podman
      - podman-tui
    state: present
  become: true

- name: Enable and start podman socket
  ansible.builtin.systemd:
    name: podman.socket
    state: started
    enabled: true
    daemon_reload: true
  become: true
  when: podman_enable_socket

# TODO: remove this cleanup block once every host has run it. The custom
# dbus-monitor script was replaced by netavark-firewalld-reload.service.
- name: Check for legacy podman firewalld reload service
  ansible.builtin.stat:
    path: /etc/systemd/system/podman-firewalld-reload.service
  register: podman_legacy_firewalld_reload

- name: Stop and disable legacy podman firewalld reload service
  ansible.builtin.systemd:
    name: podman-firewalld-reload.service
    state: stopped
    enabled: false
  become: true
  when: podman_legacy_firewalld_reload.stat.exists

- name: Remove legacy podman firewalld reload files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/podman-firewalld-reload.service
    - /usr/local/bin/podman-firewalld-reload
  become: true

- name: Reload systemd after removing legacy podman firewalld reload service
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
  when: podman_legacy_firewalld_reload.stat.exists

# netavark ships this unit but doesn't enable it. It reapplies container
# firewall rules when firewalld starts, restarts, or reloads.
- name: Enable and start netavark firewalld reload service
  ansible.builtin.systemd:
    name: netavark-firewalld-reload.service
    state: started
    enabled: true
  become: true

- name: Login to podman registries
  containers.podman.podman_login:
    registry: "{{ item.registry }}"
    username: "{{ item.username }}"
    password: "{{ item.password }}"
  loop: "{{ podman_registries }}"
  become: true
  no_log: true
  changed_when: false

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
