---
# tasks file for jaredhocutt.homelab.cloudflared

- name: Pull container images
  containers.podman.podman_image:
    name: "{{ item.image }}:{{ item.image_tag }}"
    state: present
  become: true
  loop:
    - image: "{{ cloudflared_image }}"
      image_tag: "{{ cloudflared_image_tag }}"

- name: Create secrets
  containers.podman.podman_secret:
    name: "{{ item.key }}"
    data: "{{ item.value }}"
    state: present
  become: true
  no_log: true
  loop: "{{ cloudflared_secrets_combined | dict2items }}"

- name: Create cloudflared container
  containers.podman.podman_container:
    name: "{{ cloudflared_name }}"
    image: "{{ cloudflared_image }}:{{ cloudflared_image_tag }}"
    network: "{{ ('container:' + cloudflared_attach_to) if cloudflared_network_mode == 'container' else omit }}"
    env: "{{ lookup('jaredhocutt.homelab.container_config', 'env') }}"
    secrets: "{{ lookup('jaredhocutt.homelab.container_config', 'secrets') }}"
    command:
      - tunnel
      - --no-autoupdate
      - run
    labels: "{{ lookup('jaredhocutt.homelab.container_config', 'labels') }}"
    quadlet_file_mode: "0600"
    quadlet_options: "{{ lookup('jaredhocutt.homelab.container_config', 'quadlet_options') }}"
    state: quadlet
  notify: Restart {{ cloudflared_name }}
  become: true

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
