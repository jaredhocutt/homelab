---

- name: Stop services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
  become: true
  failed_when: false
  loop:
    - "{{ karakeep_name }}.service"
    - "{{ karakeep_name }}-meilisearch.service"
    - "{{ karakeep_name }}-browserless.service"
    - "{{ karakeep_volume_data }}-volume.service"
    - "{{ karakeep_meilisearch_volume_data }}-volume.service"
    - "{{ karakeep_name }}-network.service"

- name: Destroy containers
  containers.podman.podman_container:
    name: "{{ item }}"
    state: absent
  become: true
  loop:
    - "{{ karakeep_name }}"
    - "{{ karakeep_name }}-meilisearch"
    - "{{ karakeep_name }}-browserless"

- name: Destroy secrets
  containers.podman.podman_secret:
    name: "{{ item.key }}"
    state: absent
  become: true
  no_log: true
  loop: "{{ karakeep_secrets_combined | dict2items }}"

- name: Destroy volumes
  containers.podman.podman_volume:
    name: "{{ item }}"
    state: absent
  become: true
  loop:
    - "{{ karakeep_volume_data }}"
    - "{{ karakeep_meilisearch_volume_data }}"

- name: Detach traefik from proxy network
  ansible.builtin.include_role:
    name: jaredhocutt.homelab.traefik
    tasks_from: detach
  vars:
    traefik_attach_network: "{{ karakeep_traefik_network }}"
  when: karakeep_traefik_enable

- name: Destroy network
  containers.podman.podman_network:
    name: "{{ karakeep_name }}"
    state: absent
  become: true

- name: Cleanup quadlet files
  ansible.builtin.file:
    path: /etc/containers/systemd/{{ item }}
    state: absent
  become: true
  loop:
    - "{{ karakeep_name }}.container"
    - "{{ karakeep_name }}-meilisearch.container"
    - "{{ karakeep_name }}-browserless.container"
    - "{{ karakeep_volume_data }}.volume"
    - "{{ karakeep_meilisearch_volume_data }}.volume"
    - "{{ karakeep_name }}.network"

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
