---
# Reverses dnf_automatic.yml when server_setup_dnf_automatic is false

- name: Stop and disable dnf-automatic.timer
  ansible.builtin.systemd:
    name: dnf-automatic.timer
    state: stopped
    enabled: false
  become: true
  failed_when: false

- name: Remove dnf-automatic configuration
  ansible.builtin.file:
    path: /etc/dnf/automatic.conf
    state: absent
  become: true

- name: Remove dnf-automatic
  ansible.builtin.dnf:
    name: dnf5-plugin-automatic
    state: absent
    # Also removes dependencies nothing else needs (as dnf autoremove would)
    autoremove: true
  become: true
