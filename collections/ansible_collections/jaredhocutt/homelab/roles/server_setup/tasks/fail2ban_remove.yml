---
# Reverses fail2ban.yml when server_setup_fail2ban is false

- name: Stop and disable fail2ban
  ansible.builtin.systemd:
    name: fail2ban.service
    state: stopped
    enabled: false
  become: true
  failed_when: false

- name: Remove fail2ban configuration
  ansible.builtin.file:
    path: /etc/fail2ban/jail.d/sshd.conf
    state: absent
  become: true

- name: Remove fail2ban
  ansible.builtin.dnf:
    name: fail2ban
    state: absent
    # Also removes dependencies nothing else needs (as dnf autoremove would)
    autoremove: true
  become: true
