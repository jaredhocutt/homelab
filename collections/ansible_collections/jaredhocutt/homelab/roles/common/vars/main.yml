---
# vars file for jaredhocutt.homelab.common

###############################################################################
# Envrionment
###############################################################################

common_container_env_defaults:
  TZ: "{{ common_timezone }}"

###############################################################################
# Quadlet Options
###############################################################################

# Merged into every container's quadlet options by the container_config lookup
common_container_quadlet_options_defaults:
  - |
    [Service]
    Restart=always
  - |
    [Install]
    WantedBy=multi-user.target
