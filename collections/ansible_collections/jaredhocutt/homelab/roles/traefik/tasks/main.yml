---
# tasks file for jaredhocutt.homelab.traefik

- name: Install packages
  ansible.builtin.dnf:
    name:
      - python3-cryptography
    state: present
  become: true

- name: Pull container images
  containers.podman.podman_image:
    name: "{{ item.image }}:{{ item.image_tag }}"
    state: present
  become: true
  loop:
    - image: "{{ traefik_image }}"
      image_tag: "{{ traefik_image_tag }}"

- name: Create network
  containers.podman.podman_network:
    name: "{{ traefik_name }}"
    driver: bridge
    disable_dns: false
    quadlet_file_mode: "0600"
    state: quadlet
  become: true

# App roles add their proxy networks through drop-ins (tasks/attach.yml). Each
# drop-in makes traefik's unit require that network, so one left pointing at a
# deleted network would stop traefik from starting at all.
- name: Find proxy network drop-ins
  ansible.builtin.find:
    paths: /etc/containers/systemd/{{ traefik_name }}.container.d
    patterns: "network-*.conf"
  become: true
  register: _traefik_dropins

- name: Check proxy network drop-ins point at existing networks
  ansible.builtin.stat:
    path: /etc/containers/systemd/{{ item.path | basename | splitext | first | regex_replace('^network-', '') }}.network
  become: true
  loop: "{{ _traefik_dropins.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  register: _traefik_dropin_networks

- name: Assert proxy network drop-ins point at existing networks
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: >-
      {{ item.item.path }} adds {{ item.item.path | basename | splitext | first | regex_replace('^network-', '') }}.network,
      which doesn't exist, so traefik would fail to start. Run the owning role's
      destroy.yml or delete the drop-in.
    quiet: true
  loop: "{{ _traefik_dropin_networks.results }}"
  loop_control:
    label: "{{ item.item.path | basename }}"

- name: Create volumes
  containers.podman.podman_volume:
    name: "{{ item.name }}"
    quadlet_options: "{{ item.options | default(omit) }}"
    quadlet_file_mode: "0600"
    state: quadlet
  become: true
  loop:
    - name: "{{ traefik_volume_certs }}"
      options: "{{ traefik_volume_certs_options | default(omit) }}"
    - name: "{{ traefik_volume_dynamic }}"
      options: "{{ traefik_volume_dynamic_options | default(omit) }}"
  register: _traefik_created_volumes

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
  when: _traefik_created_volumes.changed  # noqa: no-handler

- name: Generate certificates and configuration
  ansible.builtin.import_tasks: config.yml

- name: Create secrets
  containers.podman.podman_secret:
    name: "{{ item.key }}"
    data: "{{ item.value }}"
    state: present
  become: true
  no_log: true
  loop: "{{ traefik_secrets_combined | dict2items }}"

- name: Create traefik container
  containers.podman.podman_container:
    name: "{{ traefik_name }}"
    image: "{{ traefik_image }}:{{ traefik_image_tag }}"
    network: "{{ traefik_name }}.network"
    env: "{{ lookup('jaredhocutt.homelab.container_config', 'env') }}"
    secrets: "{{ lookup('jaredhocutt.homelab.container_config', 'secrets') }}"
    security_opt:
      - label=disable
    volumes:
      - /run/podman/podman.sock:/var/run/docker.sock:Z
      - "{{ traefik_volume_certs }}.volume:/certs"
      - "{{ traefik_volume_dynamic }}.volume:/dynamic"
    publish: "{{ traefik_ports }}"
    command: "{{ traefik_command_defaults + traefik_command }}"
    labels: "{{ lookup('jaredhocutt.homelab.container_config', 'labels') }}"
    quadlet_file_mode: "0600"
    quadlet_options: "{{ lookup('jaredhocutt.homelab.container_config', 'quadlet_options') }}"
    state: quadlet
  notify: Restart {{ traefik_name }}
  become: true

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
