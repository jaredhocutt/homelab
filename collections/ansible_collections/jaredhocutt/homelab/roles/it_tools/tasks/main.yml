---
# tasks file for jaredhocutt.homelab.it_tools

- name: Pull container images
  containers.podman.podman_image:
    name: "{{ item.image }}:{{ item.image_tag }}"
    state: present
  become: true
  loop:
    - image: "{{ it_tools_image }}"
      image_tag: "{{ it_tools_image_tag }}"

- name: Create network
  containers.podman.podman_network:
    name: "{{ it_tools_name }}"
    driver: bridge
    disable_dns: false
    opt:
      isolate: "true"
    quadlet_file_mode: "0600"
    state: quadlet
  become: true

- name: Create secrets
  containers.podman.podman_secret:
    name: "{{ item.key }}"
    data: "{{ item.value }}"
    state: present
  become: true
  no_log: true
  loop: "{{ it_tools_secrets_combined | dict2items }}"

- name: Create it_tools container
  containers.podman.podman_container:
    name: "{{ it_tools_name }}"
    image: "{{ it_tools_image }}:{{ it_tools_image_tag }}"
    network:
      - "{{ it_tools_name }}.network"
      - "{{ it_tools_traefik_enable | ternary(common_traefik_network ~ '.network', omit) }}"
    env: "{{ lookup('jaredhocutt.homelab.container_config', 'env') }}"
    secrets: "{{ lookup('jaredhocutt.homelab.container_config', 'secrets') }}"
    publish: "{{ it_tools_traefik_enable | ternary(omit, it_tools_ports) }}"
    labels: "{{ lookup('jaredhocutt.homelab.container_config', 'labels') }}"
    quadlet_file_mode: "0600"
    quadlet_options: "{{ lookup('jaredhocutt.homelab.container_config', 'quadlet_options') }}"
    state: quadlet
  notify: Restart {{ it_tools_name }}
  become: true

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
