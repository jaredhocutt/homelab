---
# vars file for jaredhocutt.homelab.palworld

palworld_option_settings_defaults:
  ServerName: "{{ palworld_server_name }}"
  ServerPassword: "{{ palworld_server_password }}"
  AdminPassword: "{{ palworld_admin_password }}"

palworld_option_settings_combined: >-
  {{ palworld_option_settings_defaults
  | combine(palworld_option_settings, recursive=True) }}


###############################################################################
# Envrionment
###############################################################################

palworld_container_env_defaults: {}

###############################################################################
# Secrets
###############################################################################

palworld_secrets_defaults: {}

palworld_secrets_combined: >-
  {{ palworld_secrets_defaults
  | combine(palworld_secrets, recursive=True) }}

palworld_container_secrets_defaults: []

###############################################################################
# Container Labels
###############################################################################

palworld_container_labels_defaults: {}

###############################################################################
# Quadlet Options
###############################################################################

palworld_container_quadlet_options_defaults: "{{ common_quadlet_options_defaults }}"
