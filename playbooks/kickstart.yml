---

- name: Generate kickstart file
  hosts: all
  gather_facts: false
  tasks:
    # Every host renders to the same /tmp/ks.cfg, so running for more than one
    # would silently leave whichever host ran last.
    - name: Require exactly one target host
      ansible.builtin.assert:
        that: ansible_play_hosts_all | length == 1
        fail_msg: "Render one host at a time: add --limit <host>"
        quiet: true
      tags: [always]

    - name: Create kickstart file
      ansible.builtin.import_role:
        name: jaredhocutt.homelab.kickstart
      delegate_to: localhost
      tags: [kickstart]
