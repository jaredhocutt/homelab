---

common_traefik_domain: "{{ lookup('jaredhocutt.homelab.bws', 'pta_common_traefik_domain') }}"

###############################################################################
# kickstart
###############################################################################

kickstart_hostname: pta
kickstart_network:
  - device: enp2s0
    activate: true
  - device: wlp3s0
    activate: false

kickstart_storage_disks:
  - name: disk/by-id/nvme-KINGSTON_OM8PGP4512Q-A0_50026B7381D7D9BF
    partitions:
      - mountpoint: /boot/efi
        filesystem: efi
        size: 600
        options: --fsoptions="umask=0077,shortname=winnt"
      - mountpoint: /boot
        filesystem: xfs
        size: 1024
      - mountpoint: pv.01
        filesystem: lvmpv
        size: 1
        options: --grow
  - name: disk/by-id/ata-Samsung_SSD_870_EVO_1TB_S6PTNM0TA65377B
    partitions:
      - mountpoint: pv.02
        filesystem: lvmpv
        size: 1
        options: --grow
kickstart_storage_volume_groups:
  - name: fedora
    physical_volumes:
      - pv.01
    logical_volumes:
      - name: root
        mountpoint: /
        filesystem: xfs
        size: "{{ 1024 * 60 }}"  # 60 GB
      - name: home
        mountpoint: /home
        filesystem: xfs
        size: "{{ 1024 * 40 }}"  # 40 GB
      - name: swap
        mountpoint: swap
        filesystem: swap
        size: "{{ 1024 * 4 }}"  # 4 GB
  - name: data
    physical_volumes:
      - pv.02
    logical_volumes:
      - name: podman
        mountpoint: /var/lib/containers
        filesystem: xfs
        percent: 100

kickstart_users:
  - fullname: "{{ lookup('jaredhocutt.homelab.bws', 'server_user_1_fullname') }}"
    username: "{{ lookup('jaredhocutt.homelab.bws', 'server_user_1_username') }}"
    groups: "{{ lookup('jaredhocutt.homelab.bws', 'server_user_1_groups') }}"
    uid: "{{ lookup('jaredhocutt.homelab.bws', 'server_user_1_uid') }}"
    gid: "{{ lookup('jaredhocutt.homelab.bws', 'server_user_1_gid') }}"
    password: "{{ lookup('jaredhocutt.homelab.bws', 'server_user_1_password_crypted') }}"
    authorized_keys: "{{ lookup('jaredhocutt.homelab.bws', 'server_user_1_authorized_keys') | split('\n') }}"
  - fullname: "{{ lookup('jaredhocutt.homelab.bws', 'server_user_2_fullname') }}"
    username: "{{ lookup('jaredhocutt.homelab.bws', 'server_user_2_username') }}"
    groups: "{{ lookup('jaredhocutt.homelab.bws', 'server_user_2_groups') }}"
    uid: "{{ lookup('jaredhocutt.homelab.bws', 'server_user_2_uid') }}"
    gid: "{{ lookup('jaredhocutt.homelab.bws', 'server_user_2_gid') }}"
    sudoers: |
      {{ lookup('jaredhocutt.homelab.bws', 'server_user_2_username') }} ALL=(ALL) NOPASSWD: ALL
      Defaults:{{ lookup('jaredhocutt.homelab.bws', 'server_user_2_username') }} !requiretty
    authorized_keys: "{{ lookup('jaredhocutt.homelab.bws', 'server_user_2_authorized_keys') | split('\n') }}"
