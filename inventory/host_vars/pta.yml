---
# yamllint disable rule:line-length

common_traefik_domain: "{{ lookup('jaredhocutt.homelab.bws', 'pta_common_traefik_domain') }}"

###############################################################################
# backrest
###############################################################################

backrest_version: v1.14.1

backrest_traefik_host: "backrest.{{ common_traefik_domain }}"

backrest_env:
  BACKREST_PORT: 0.0.0.0:9898

###############################################################################
# bentopdf
###############################################################################

bentopdf_image_tag: v2.8.8  # skopeo list-tags docker://ghcr.io/alam00000/bentopdf-simple | jq -r '.Tags[] | select(test("^v[0-9\\.]+$"))'

newt_bentopdf_secrets:
  newt_bentopdf_newt_id: "{{ lookup('jaredhocutt.homelab.bws', 'pta_newt_bentopdf_newt_id') }}"
  newt_bentopdf_newt_secret: "{{ lookup('jaredhocutt.homelab.bws', 'pta_newt_bentopdf_newt_secret') }}"
newt_bentopdf_container_secrets:
  - newt_bentopdf_newt_id,type=env,target=NEWT_ID
  - newt_bentopdf_newt_secret,type=env,target=NEWT_SECRET

###############################################################################
# blaze
###############################################################################

blaze_image_tag: release-v3.0.1  # skopeo list-tags docker://docker.io/akashhamirwasia/blaze | jq -r '.Tags[] | select(test("^release-v[0-9\\.]+$"))'

newt_blaze_secrets:
  newt_blaze_newt_id: "{{ lookup('jaredhocutt.homelab.bws', 'pta_newt_blaze_newt_id') }}"
  newt_blaze_newt_secret: "{{ lookup('jaredhocutt.homelab.bws', 'pta_newt_blaze_newt_secret') }}"
newt_blaze_container_secrets:
  - newt_blaze_newt_id,type=env,target=NEWT_ID
  - newt_blaze_newt_secret,type=env,target=NEWT_SECRET

###############################################################################
# convertx
###############################################################################

convertx_image_tag: v0.18.0  # skopeo list-tags docker://ghcr.io/c4illin/convertx | jq -r '.Tags[] | select(test("^v[0-9\\.]+$"))'

convertx_jwt_secret: "{{ lookup('jaredhocutt.homelab.bws', 'pta_convertx_jwt_secret') }}"

###############################################################################
# it_tools
###############################################################################

it_tools_image_tag: 2024.10.22-7ca5933  # skopeo list-tags docker://ghcr.io/corentinth/it-tools | jq -r '.Tags[] | select(test("^[0-9]{4}\\.[0-9]+\\.[0-9]+-[0-9a-f]+$"))'

newt_it_tools_secrets:
  newt_it_tools_newt_id: "{{ lookup('jaredhocutt.homelab.bws', 'pta_newt_it_tools_newt_id') }}"
  newt_it_tools_newt_secret: "{{ lookup('jaredhocutt.homelab.bws', 'pta_newt_it_tools_newt_secret') }}"
newt_it_tools_container_secrets:
  - newt_it_tools_newt_id,type=env,target=NEWT_ID
  - newt_it_tools_newt_secret,type=env,target=NEWT_SECRET

###############################################################################
# n8n
###############################################################################

n8n_image_tag: "2.40.1"  # skopeo list-tags docker://ghcr.io/n8n-io/n8n | jq -r '.Tags[] | select(test("^2\\.[0-9\\.]+$"))'
n8n_postgres_image_tag: "16.15"  # skopeo list-tags docker://docker.io/library/postgres | jq -r '.Tags[] | select(test("^16\\.[0-9]"))'

n8n_postgres_password: "{{ lookup('jaredhocutt.homelab.bws', 'pta_n8n_postgres_password') }}"

n8n_container_env:
  N8N_LOG_LEVEL: debug

###############################################################################
# newt
###############################################################################

newt_image_tag: "1.16.0"  # skopeo list-tags docker://ghcr.io/fosrl/newt | jq -r '.Tags[] | select(test("^[0-9\\.]+$"))'

newt_endpoint: https://pangolin.{{ lookup('jaredhocutt.homelab.bws', 'pta_pangolin_base_domain') }}

###############################################################################
# traefik
###############################################################################

traefik_image_tag: v3.7.13  # skopeo list-tags docker://ghcr.io/traefik/traefik | jq -r '.Tags[] | select(test("^v[0-9\\.]+$"))'

traefik_traefik_host: traefik.{{ common_traefik_domain }}

traefik_command:
  - --certificatesresolvers.letsencrypt.acme.email={{ lookup('jaredhocutt.homelab.bws', 'pta_traefik_letsencrypt_email') }}
  - --certificatesresolvers.letsencrypt.acme.storage=/certs/acme.json
  - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare
  - --certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
  - --entrypoints.websecure.http.tls.certresolver=letsencrypt

traefik_secrets:
  traefik_letsencrypt_cloudflare_dns_api_key: "{{ lookup('jaredhocutt.homelab.bws', 'traefik_letsencrypt_cloudflare_dns_api_key') }}"
  traefik_letsencrypt_cloudflare_zone_api_key: "{{ lookup('jaredhocutt.homelab.bws', 'traefik_letsencrypt_cloudflare_zone_api_key') }}"
traefik_container_secrets:
  - traefik_letsencrypt_cloudflare_dns_api_key,type=env,target=CF_DNS_API_TOKEN
  - traefik_letsencrypt_cloudflare_zone_api_key,type=env,target=CF_ZONE_API_TOKEN

###############################################################################
# uptime_kuma
###############################################################################

uptime_kuma_image_tag: "2.5.5"  # skopeo list-tags docker://ghcr.io/louislam/uptime-kuma | jq -r '.Tags[] | select(test("^[0-9\\.]+$"))'

###############################################################################
# kickstart
###############################################################################

kickstart_hostname: pta
kickstart_network:
  - device: enp2s0
    activate: true
  - device: wlp3s0
    activate: false

kickstart_storage_disks:
  - name: disk/by-id/nvme-KINGSTON_OM8PGP4512Q-A0_50026B7381D7D9BF
    partitions:
      - mountpoint: /boot/efi
        filesystem: efi
        size: 600
        options: --fsoptions="umask=0077,shortname=winnt"
      - mountpoint: /boot
        filesystem: xfs
        size: 1024
      - mountpoint: pv.01
        filesystem: lvmpv
        size: 1
        options: --grow
  - name: disk/by-id/ata-Samsung_SSD_870_EVO_1TB_S6PTNM0TA65377B
    partitions:
      - mountpoint: pv.02
        filesystem: lvmpv
        size: 1
        options: --grow
kickstart_storage_volume_groups:
  - name: fedora
    physical_volumes:
      - pv.01
    logical_volumes:
      - name: root
        mountpoint: /
        filesystem: xfs
        size: "{{ 1024 * 60 }}"  # 60 GB
      - name: home
        mountpoint: /home
        filesystem: xfs
        size: "{{ 1024 * 40 }}"  # 40 GB
      - name: swap
        mountpoint: swap
        filesystem: swap
        size: "{{ 1024 * 4 }}"  # 4 GB
  - name: data
    physical_volumes:
      - pv.02
    logical_volumes:
      - name: podman
        mountpoint: /var/lib/containers
        filesystem: xfs
        percent: 100

kickstart_users:
  - fullname: "{{ lookup('jaredhocutt.homelab.bws', 'server_user_1_fullname') }}"
    username: "{{ lookup('jaredhocutt.homelab.bws', 'server_user_1_username') }}"
    groups: "{{ lookup('jaredhocutt.homelab.bws', 'server_user_1_groups') }}"
    uid: "{{ lookup('jaredhocutt.homelab.bws', 'server_user_1_uid') }}"
    gid: "{{ lookup('jaredhocutt.homelab.bws', 'server_user_1_gid') }}"
    password: "{{ lookup('jaredhocutt.homelab.bws', 'server_user_1_password_crypted') }}"
    authorized_keys: "{{ lookup('jaredhocutt.homelab.bws', 'server_user_1_authorized_keys') | split('\n') }}"
  - fullname: "{{ lookup('jaredhocutt.homelab.bws', 'server_user_2_fullname') }}"
    username: "{{ lookup('jaredhocutt.homelab.bws', 'server_user_2_username') }}"
    groups: "{{ lookup('jaredhocutt.homelab.bws', 'server_user_2_groups') }}"
    uid: "{{ lookup('jaredhocutt.homelab.bws', 'server_user_2_uid') }}"
    gid: "{{ lookup('jaredhocutt.homelab.bws', 'server_user_2_gid') }}"
    sudoers: |
      {{ lookup('jaredhocutt.homelab.bws', 'server_user_2_username') }} ALL=(ALL) NOPASSWD: ALL
      Defaults:{{ lookup('jaredhocutt.homelab.bws', 'server_user_2_username') }} !requiretty
    authorized_keys: "{{ lookup('jaredhocutt.homelab.bws', 'server_user_2_authorized_keys') | split('\n') }}"
