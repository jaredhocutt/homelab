---
# yamllint disable rule:line-length

open_webui_image_tag: v0.12.3  # skopeo list-tags docker://ghcr.io/open-webui/open-webui | jq -r '.Tags[] | select(test("^v[0-9\\.]+$"))'

open_webui_container_env:
  WEBUI_URL: https://open-webui.{{ common_traefik_domain }}
  OAUTH_PROVIDER_NAME: Hocutt SSO
  OPENID_PROVIDER_URL: "{{ lookup('jaredhocutt.homelab.bws', 'open_webui_openid_provider_url') }}"
  OPENID_REDIRECT_URI: https://open-webui.{{ common_traefik_domain }}/oauth/oidc/callback
  ENABLE_OAUTH_SIGNUP: true
  ENABLE_LOGIN_FORM: false
  OAUTH_MERGE_ACCOUNTS_BY_EMAIL: true

open_webui_secrets:
  open_webui_oauth_client_id: "{{ lookup('jaredhocutt.homelab.bws', 'open_webui_oauth_client_id') }}"
  open_webui_oauth_client_secret: "{{ lookup('jaredhocutt.homelab.bws', 'open_webui_oauth_client_secret') }}"
  open_webui_secret_key: "{{ lookup('jaredhocutt.homelab.bws', 'open_webui_secret_key') }}"
open_webui_container_secrets:
  - open_webui_oauth_client_id,type=env,target=OAUTH_CLIENT_ID
  - open_webui_oauth_client_secret,type=env,target=OAUTH_CLIENT_SECRET
  - open_webui_secret_key,type=env,target=WEBUI_SECRET_KEY
