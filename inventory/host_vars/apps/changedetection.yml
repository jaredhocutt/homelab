---
# yamllint disable rule:line-length

changedetection_image_tag: "0.70.2"  # skopeo list-tags docker://ghcr.io/dgtlmoon/changedetection.io | jq -r '.Tags[] | select(test("^[0-9]"))'
changedetection_browser_image: ghcr.io/browserless/chrome
changedetection_browser_image_tag: v2.61.0  # skopeo list-tags docker://ghcr.io/browserless/chrome | jq -r '.Tags[] | select(test("^v[0-9\\.]+$"))'

changedetection_traefik_auth: true

changedetection_container_env:
  PLAYWRIGHT_DRIVER_URL: "ws://{{ changedetection_name }}-browser:3000/chrome"

changedetection_browser_container_env:
  CHROME_HEADFUL: "true"
