---
# yamllint disable rule:line-length

sabnzbd_image_tag: version-5.1.3  # skopeo list-tags docker://lscr.io/linuxserver/sabnzbd | jq -r '.Tags[] | select(test("^version-[0-9]"))'

sabnzbd_container_env:
  PUID: "{{ global_media_uid }}"
  PGID: "{{ global_media_gid }}"
  DOCKER_MODS: linuxserver/mods:universal-package-install
  INSTALL_PACKAGES: file

sabnzbd_volume_download: "{{ global_volume_download }}"
