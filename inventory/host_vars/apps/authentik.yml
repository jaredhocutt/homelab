---
# yamllint disable rule:line-length

authentik_image_tag: "2026.8.5"  # skopeo list-tags docker://ghcr.io/goauthentik/server | jq -r '.Tags[] | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))'
authentik_postgres_image_tag: "16.15"  # skopeo list-tags docker://docker.io/library/postgres | jq -r '.Tags[] | select(test("^16\\.[0-9]"))'

authentik_postgres_password: "{{ lookup('jaredhocutt.homelab.bws', 'authentik_postgres_password') }}"
authentik_secret_key: "{{ lookup('jaredhocutt.homelab.bws', 'authentik_secret_key') }}"

authentik_server_container_env:
  AUTHENTIK_EMAIL__HOST: "{{ lookup('jaredhocutt.homelab.bws', 'homelab_smtp_host') }}"
  AUTHENTIK_EMAIL__PORT: "{{ lookup('jaredhocutt.homelab.bws', 'homelab_smtp_port') }}"
  AUTHENTIK_EMAIL__USERNAME: "{{ lookup('jaredhocutt.homelab.bws', 'homelab_smtp_username') }}"
  AUTHENTIK_EMAIL__FROM: "{{ lookup('jaredhocutt.homelab.bws', 'authentik_email_from') }}"
  AUTHENTIK_EMAIL__USE_SSL: "true"
authentik_worker_container_env: "{{ authentik_server_container_env }}"

authentik_secrets:
  authentik_email_password: "{{ lookup('jaredhocutt.homelab.bws', 'homelab_smtp_password') }}"
authentik_server_container_secrets:
  - authentik_email_password,type=env,target=AUTHENTIK_EMAIL__PASSWORD
authentik_worker_container_secrets: "{{ authentik_server_container_secrets }}"

newt_authentik_secrets:
  newt_authentik_newt_id: "{{ lookup('jaredhocutt.homelab.bws', 'newt_authentik_newt_id') }}"
  newt_authentik_newt_secret: "{{ lookup('jaredhocutt.homelab.bws', 'newt_authentik_newt_secret') }}"
newt_authentik_container_secrets:
  - newt_authentik_newt_id,type=env,target=NEWT_ID
  - newt_authentik_newt_secret,type=env,target=NEWT_SECRET
