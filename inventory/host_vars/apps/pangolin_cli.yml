---
# yamllint disable rule:line-length

pangolin_cli_image_tag: "0.19.0"  # skopeo list-tags docker://ghcr.io/fosrl/cli | jq -r '.Tags[] | select(test("^[0-9\\.]+$"))'

pangolin_cli_endpoint: https://pangolin.{{ lookup('jaredhocutt.homelab.bws', 'pangolin_base_domain') }}

pangolin_cli_secrets:
  pangolin_cli_client_id: "{{ lookup('jaredhocutt.homelab.bws', 'pangolin_cli_apps_client_id') }}"
  pangolin_cli_client_secret: "{{ lookup('jaredhocutt.homelab.bws', 'pangolin_cli_apps_client_secret') }}"
pangolin_cli_container_secrets:
  - pangolin_cli_client_id,type=env,target=CLIENT_ID
  - pangolin_cli_client_secret,type=env,target=CLIENT_SECRET
