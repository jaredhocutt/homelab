---
# yamllint disable rule:line-length

pangolin_image_tag: "ee-1.25.3"  # skopeo list-tags docker://ghcr.io/fosrl/pangolin | jq -r '.Tags[] | select(test("^ee-[0-9\\.]+$"))'
pangolin_gerbil_image_tag: "1.5.2"  # skopeo list-tags docker://ghcr.io/fosrl/gerbil | jq -r '.Tags[] | select(test("^[0-9]\\."))'
pangolin_traefik_image_tag: v3.7.16  # skopeo list-tags docker://ghcr.io/traefik/traefik | jq -r '.Tags[] | select(test("^v[0-9\\.]+$"))'
pangolin_badger_version: v1.7.0  # github-release fosrl/badger

pangolin_gerbil_ports_extra:
  - 8211:8211/udp  # pangolin

pangolin_base_domain: "{{ lookup('jaredhocutt.homelab.bws', 'pangolin_base_domain') }}"
pangolin_server_secret: "{{ lookup('jaredhocutt.homelab.bws', 'pangolin_server_secret') }}"
pangolin_traefik_letsencrypt_email: "{{ lookup('jaredhocutt.homelab.bws', 'pangolin_smtp_no_reply') }}"

pangolin_smtp_host: "{{ lookup('jaredhocutt.homelab.bws', 'homelab_smtp_host') }}"
pangolin_smtp_port: "{{ lookup('jaredhocutt.homelab.bws', 'homelab_smtp_port') }}"
pangolin_smtp_user: "{{ lookup('jaredhocutt.homelab.bws', 'homelab_smtp_username') }}"
pangolin_smtp_password: "{{ lookup('jaredhocutt.homelab.bws', 'homelab_smtp_password') }}"
pangolin_no_reply: "{{ lookup('jaredhocutt.homelab.bws', 'pangolin_smtp_no_reply') }}"
